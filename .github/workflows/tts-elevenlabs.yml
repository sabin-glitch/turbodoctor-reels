name: tts-elevenlabs
# Generează vocea de narator cu ElevenLabs pe serverele GitHub (api.elevenlabs.io nu e accesibil din workspace-ul Claude).
# Intrare: un job din tools/tts/jobs/<job>.json (voce, model, replici). Ieșire: tts/<job>/<id>.mp3 + <job>.json pe branch-ul `sources`.
# Cheia stă în secretul ELEVENLABS_API_KEY al repo-ului (Settings → Secrets and variables → Actions). Repo-ul e public: cheia nu se scrie nicăieri.
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'numele jobului din tools/tts/jobs/ (fără .json)'
        required: true
        default: ''
permissions:
  contents: write
concurrency:
  group: tts-elevenlabs
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install -q requests
      - name: Generate the lines and push them to the sources branch
        env:
          JOB: ${{ github.event.inputs.job }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/tts/run_job.sh "$JOB"
