name: fetch-sources
# Descarcă videoclipurile din sources/queue.txt (TikTok) pe serverele GitHub, care au acces la TikTok,
# și le urcă pe branch-ul `sources` (<id>.mp4 + <id>.json + manifest.json). Claude le ia de acolo la editat.
on:
  push:
    branches: [main]
    paths: ['sources/queue.txt', 'sources/fetch.sh', '.github/workflows/fetch-sources.yml']
  workflow_dispatch:
    inputs:
      urls:
        description: 'URL-uri TikTok separate prin spațiu sau linie nouă (gol = sources/queue.txt)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: fetch-sources
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install -q -U yt-dlp
      - name: Fetch videos and push to the sources branch
        env:
          URLS: ${{ github.event.inputs.urls }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash sources/fetch.sh
