<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><title>Turbo Doctor Reel Compositor v2</title>
<style>
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_700Bold.ttf);font-weight:700}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_800ExtraBold.ttf);font-weight:800}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_900Black.ttf);font-weight:900}
@font-face{font-family:Anton;src:url(assets/fonts/Anton_400Regular.ttf)}
@font-face{font-family:JB;font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:JB;font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:JB;font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:JB;font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:JB;font-weight:800;src:url(assets/fonts/jetbrains-mono-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:JB;font-weight:800;src:url(assets/fonts/jetbrains-mono-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--ink:#0F1216;--muted:#6B7480;--red:#FF3B3B;--red2:#E11D2E;--green:#22C55E;--yellow:#FFD21F;--cyan:#62D8FF;--bp:#071425;--paper:#FFFDF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:Mont}
/* NO permanent colour filter on footage: colour only as short highlight accents (fx list) */
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
#glitch{position:absolute;inset:0;display:none;overflow:hidden}
.gs{position:absolute;left:0;width:1080px;background-size:1080px 1920px;background-repeat:no-repeat}
#tintR{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,40,40,.05),rgba(150,0,0,.6));opacity:0}
#tintG{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(60,255,140,.04),rgba(0,110,50,.55));opacity:0}
#scanLine{position:absolute;left:0;top:0;width:1080px;height:70px;background:linear-gradient(to bottom,rgba(98,216,255,0),rgba(98,216,255,.55) 70%,#E6FAFF 86%,rgba(98,216,255,0));display:none}
#vig{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.34) 0,rgba(0,0,0,0) 15%,rgba(0,0,0,0) 80%,rgba(0,0,0,.28) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
.abs{position:absolute;left:0;top:0;display:none;will-change:transform,opacity}
.emo{filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.mono{font-family:JB;font-weight:700;text-transform:uppercase;letter-spacing:2px}
/* ---------- captions ---------- */
#cap{position:absolute;left:80px;width:860px;top:1290px;height:240px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;text-align:center;font-weight:900;font-size:80px;line-height:1.08;text-transform:uppercase;letter-spacing:-.5px}
#cap span{display:inline-block;margin:0 18px;color:#fff;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 7px 0 rgba(0,0,0,.6),0 12px 28px rgba(0,0,0,.55);transform-origin:50% 60%}
#cap span.r{color:#FF4B4B}#cap span.g{color:#4ADE80}#cap span.c{color:var(--cyan)}#cap span.y{color:var(--yellow)}
#cap span.on{color:var(--yellow)}#cap span.on.r{color:#FF6B6B}#cap span.on.g{color:#86EFAC}#cap span.on.c{color:#A5E9FF}#cap span.on.y{color:#FFE88A}
/* ---------- stage progress bar (Simptome > Investigație > Cauza > Soluția) ---------- */
#stg{display:none;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;background:rgba(6,10,18,.74);border:2px solid rgba(255,255,255,.14);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.sg{display:flex;align-items:center;gap:9px;font-family:JB;font-weight:800;font-size:21px;letter-spacing:1.5px;color:rgba(255,255,255,.42);white-space:nowrap}
.sgDot{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.35);position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.sgDot svg{display:none}
.sg.done{color:rgba(255,255,255,.78)}.sg.done .sgDot{background:#22C55E;border-color:#22C55E}.sg.done .sgDot svg{display:block}
.sg.cur{color:#fff}.sg.cur .sgDot{background:var(--yellow);border-color:var(--yellow)}
.sgRing{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--yellow);opacity:0}
.sgLine{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);position:relative;overflow:hidden;flex:none}
.sgFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#22C55E}
/* ---------- hook ---------- */
#hTag{display:none;align-items:center;gap:12px;padding:9px 22px 9px 16px;border-radius:999px;background:rgba(6,10,18,.8);border:2px solid rgba(255,75,75,.75);color:#fff;font-family:JB;font-weight:800;font-size:24px;letter-spacing:2px;white-space:nowrap}
#hTag .dot{width:16px;height:16px;border-radius:50%;background:#FF3B30;box-shadow:0 0 12px #FF3B30}
.hookTxt{font-family:Anton;line-height:1;white-space:nowrap;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 8px 0 #000,0 14px 30px rgba(0,0,0,.6);letter-spacing:1px;text-align:center}
#hL1{font-size:112px;color:#fff}
#hL2{font-size:168px;color:#FFD21F}
.hookTxt .y{color:var(--yellow)}.hookTxt .r{color:#FF3B30}.hookTxt .g{color:#4ADE80}.hookTxt .c{color:var(--cyan)}.hookTxt .w{color:#fff}
#hCar{display:none;align-items:center;gap:10px;padding:8px 26px 8px 14px;border-radius:999px;background:#fff;color:var(--ink);font-weight:900;font-size:34px;letter-spacing:.5px;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.5)}
#hCar img{width:46px;height:46px}
#hookChips{display:none;gap:16px}
.hChip{display:flex;align-items:center;gap:8px;padding:8px 22px 8px 10px;border-radius:999px;background:rgba(6,10,18,.85);color:#fff;font-family:JB;font-weight:800;font-size:28px;letter-spacing:1px;border:3px solid #FF4B4B;box-shadow:0 10px 24px rgba(0,0,0,.5);opacity:0;white-space:nowrap}
.hChip img{width:42px;height:42px}
/* ---------- shared card styles ---------- */
.card{background:#fff;border-radius:28px;box-shadow:0 18px 44px rgba(0,0,0,.5);color:var(--ink)}
.dk{background:rgba(6,12,22,.92);border:3px solid rgba(98,216,255,.42);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.55);color:#EAF6FF}
.cTitle{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:28px;letter-spacing:.5px;line-height:1.1;white-space:nowrap}
.cTitle img{width:44px;height:44px}
.kTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:JB;font-weight:800;font-size:22px;letter-spacing:2px;color:var(--cyan);white-space:nowrap;text-transform:uppercase}
.kTitle .t2{color:var(--yellow)}
.kTitle img{width:36px;height:36px;vertical-align:-9px;margin-right:8px}
.status{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:30px;height:44px;margin-top:8px;white-space:nowrap}
.status img{width:42px;height:42px}
.chip{display:none;align-items:center;gap:12px;padding:10px 28px 10px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:900;font-size:34px;letter-spacing:.5px;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.5);border:3px solid #fff}
.chip img{width:52px;height:52px}
.chip.red{background:var(--red2)}.chip.green{background:#16A34A}.chip.yellow{background:var(--yellow);color:var(--ink)}.chip.blue{background:#0369A1}
/* patient file */
.fisa{width:700px;background:var(--paper);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.55);color:var(--ink);padding:0 0 14px;overflow:visible}
.fClip{position:absolute;left:50%;top:-22px;width:150px;height:44px;margin-left:-75px;border-radius:12px;background:linear-gradient(#9AA3AD,#5B6470);border:4px solid #2C323A;box-shadow:0 6px 10px rgba(0,0,0,.35)}
.fClip:after{content:'';position:absolute;left:50%;top:9px;width:36px;height:14px;margin-left:-18px;border-radius:8px;background:#1F242B}
.fHead{display:flex;align-items:center;gap:12px;background:var(--red2);color:#fff;border-radius:26px 26px 0 0;padding:26px 24px 14px;font-weight:900;font-size:30px;letter-spacing:1.5px;white-space:nowrap}
.fHead img{width:46px;height:46px}
.fHead .fNo{margin-left:auto;font-family:JB;font-weight:800;font-size:20px;letter-spacing:2px;opacity:.9}
.fRow{display:none;align-items:center;gap:14px;margin:0 22px;padding:11px 2px;border-bottom:3px dashed #E5E1D5;opacity:0}
.fRow:last-of-type{border-bottom:none}
.fL{width:190px;flex:none;font-family:JB;font-weight:800;font-size:18px;letter-spacing:2px;color:#8A8F98;text-transform:uppercase}
.fV{flex:1;font-weight:900;font-size:33px;line-height:1.08;color:var(--ink)}
.fV.r{color:#C81E2C}.fV.g{color:#15803D}.fV.c{color:#0E6E8C}.fV.y{color:#B45309}
.fV img{width:40px;height:40px;vertical-align:-8px;margin-right:6px}
.fEcg{margin:4px 22px 0;height:34px}
.fStamp{position:absolute;right:20px;bottom:-96px;font-family:Anton;font-size:52px;letter-spacing:3px;padding:2px 18px 0;border:6px solid;border-radius:12px;opacity:0;transform-origin:50% 50%;background:rgba(255,255,255,.8)}
/* checklist */
.ckRow{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:3px solid #EEF0F3;font-weight:900;font-size:31px;color:#9AA3AD;white-space:nowrap}
.ckRow:last-of-type{border-bottom:none}
.box{width:52px;height:52px;border-radius:14px;border:5px solid #CBD2D9;flex:none;position:relative;overflow:hidden}
.box .fill{position:absolute;inset:0;background:var(--green);border-radius:9px;transform:scale(0)}
.box.bad .fill{background:var(--red2)}
.box svg{position:absolute;left:-1px;top:-1px}
/* ecg / trace monitor */
.ecgBox{width:700px;background:#0B1015;border-radius:26px;border:4px solid #2B3540;box-shadow:0 18px 44px rgba(0,0,0,.6);padding:14px 18px 12px;color:#fff}
.eTop{display:flex;align-items:center;justify-content:space-between;font-family:JB;font-weight:800;font-size:24px;letter-spacing:2px;white-space:nowrap}
.eTop img{width:38px;height:38px;vertical-align:-10px;margin-right:8px}
.eVal{padding:4px 16px;border-radius:999px;font-size:22px}
.ecgSvg{display:block;margin-top:8px;border-radius:14px;background-image:linear-gradient(rgba(74,222,128,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(74,222,128,.10) 2px,transparent 2px);background-size:40px 40px;background-color:#05080B}
/* stat */
.odo{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:16px auto 6px;background:#11151A;border-radius:20px;padding:14px 28px 10px;width:max-content;box-shadow:inset 0 4px 10px rgba(0,0,0,.6)}
.odo .dg{font-family:Anton;font-size:100px;line-height:1;color:#fff;letter-spacing:3px}
.odo .un{font-family:Anton;font-size:46px;line-height:1.2;color:#9AA3AD;margin-bottom:8px}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:26px;color:var(--muted);letter-spacing:1px;margin-top:6px;white-space:nowrap}
.sub img{width:38px;height:38px}
/* compare */
.mCols{display:flex;gap:14px;margin-top:14px}
.mCol{flex:1;border-radius:22px;padding:14px 10px 16px;text-align:center;border:5px solid;opacity:0}
.mCol .h{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:2px}
.mCol .h img{width:40px;height:40px}
.mCol .v{font-weight:900;font-size:33px;line-height:1.1;margin-top:8px}
.mCol .v.big{font-family:Anton;font-weight:400;font-size:76px;line-height:1.05}
.mCol.bad{background:#FEE2E2;border-color:#E11D2E;color:#B91C1C}
.mCol.ok{background:#DCFCE7;border-color:#16A34A;color:#15803D}
/* illustration */
.artWrap{position:relative;height:230px;margin-top:6px;display:flex;justify-content:center}
.artWrap svg{height:230px;width:auto}
.artX{position:absolute;right:90px;top:20px;width:96px;height:96px;opacity:0}
/* blueprint schematic panel */
.bp{width:920px;background:var(--bp);border:3px solid rgba(98,216,255,.6);border-radius:24px;box-shadow:0 22px 54px rgba(0,0,0,.65);overflow:hidden;color:#EAF6FF}
.bpH{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;background:rgba(98,216,255,.13);border-bottom:2px solid rgba(98,216,255,.35);font-family:JB;font-weight:800;font-size:22px;letter-spacing:2px;color:#62D8FF;white-space:nowrap}
.bpH .t2{color:#FFD21F}
.bpS{display:block;background-color:#071425;background-image:linear-gradient(rgba(98,216,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(98,216,255,.09) 1px,transparent 1px),linear-gradient(rgba(98,216,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(98,216,255,.04) 1px,transparent 1px);background-size:80px 80px,80px 80px,20px 20px,20px 20px}
.bpF{display:flex;align-items:center;gap:14px;padding:14px 22px 16px;border-top:2px solid rgba(98,216,255,.25);font-weight:900;font-size:30px;line-height:1.12;min-height:78px}
.bpF .n{flex:none;font-family:JB;font-weight:800;font-size:20px;color:#071425;background:#62D8FF;border-radius:8px;padding:4px 10px;letter-spacing:1px}
.bpF.r .n{background:#FF4B4B;color:#fff}.bpF.g .n{background:#4ADE80}.bpF.y .n{background:#FFD21F}
.bpF.r .tx{color:#FF8A8A}.bpF.g .tx{color:#86EFAC}.bpF.y .tx{color:#FFE88A}
/* root-cause chain */
.chainV{width:860px;padding:18px 24px 22px}
.cn{display:flex;align-items:center;gap:16px;padding:12px 18px;border-radius:18px;border:3px solid;opacity:0}
.cn img{width:52px;height:52px;flex:none}
.cn .k{font-family:JB;font-weight:800;font-size:17px;letter-spacing:2px;opacity:.85}
.cn .v{font-weight:900;font-size:31px;line-height:1.08;color:#fff}
.cn.r{border-color:#FF4B4B;background:rgba(225,29,46,.18)}.cn.r .k{color:#FF8A8A}
.cn.y{border-color:#FFD21F;background:rgba(255,210,31,.12)}.cn.y .k{color:#FFE88A}
.cn.c{border-color:#62D8FF;background:rgba(98,216,255,.12)}.cn.c .k{color:#A5E9FF}
.cn.g{border-color:#4ADE80;background:rgba(74,222,128,.14)}.cn.g .k{color:#86EFAC}
.carr{height:36px;display:flex;justify-content:center;align-items:center}
/* process pipeline */
.pipe{width:920px;padding:20px 20px 22px}
.ppRow{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px;position:relative}
.ps{width:200px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:900;font-size:23px;text-align:center;line-height:1.1;color:#9AA3AD;position:relative;z-index:2}
.ps .c{width:98px;height:98px;border-radius:50%;background:#EEF0F3;border:6px solid #CBD2D9;display:flex;align-items:center;justify-content:center}
.ps .c img{width:60px;height:60px;filter:grayscale(1) opacity(.45)}
.ps.on{color:var(--ink)}.ps.on .c{background:#DCFCE7;border-color:#16A34A}.ps.on .c img{filter:none}
.ppLine{position:absolute;top:47px;height:6px;border-radius:3px;background:#E5E7EB;z-index:1;overflow:hidden}
.ppFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#16A34A}
/* gauge */
.gauge{width:640px;padding:18px 22px 18px}
.gRead{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;font-family:JB;font-weight:800;font-size:26px;letter-spacing:2px;height:40px}
/* bars */
.barsC{width:860px;padding:20px 26px 22px}
.bRow{margin-top:14px;opacity:0}
.bLab{display:flex;justify-content:space-between;font-weight:900;font-size:26px;color:#EAF6FF}
.bLab .bv{font-family:JB;font-weight:800;font-size:24px}
.bTrack{height:30px;border-radius:15px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.bFill{height:100%;width:0;border-radius:15px;background:#62D8FF}
.bRow.r .bFill{background:#FF4B4B}.bRow.r .bv{color:#FF8A8A}.bRow.g .bFill{background:#4ADE80}.bRow.g .bv{color:#86EFAC}.bRow.y .bFill{background:#FFD21F}.bRow.y .bv{color:#FFE88A}
/* equation */
.eqC{width:860px;padding:18px 26px 24px}
.eqL{font-family:JB;font-weight:800;font-size:46px;letter-spacing:1px;text-align:center;margin-top:12px;opacity:0;white-space:nowrap}
.eqL.r{color:#FF6B6B}.eqL.y{color:#FFD21F}.eqL.g{color:#4ADE80}.eqL.w{color:#fff}.eqL.c{color:#62D8FF}
.eqL.big{font-family:Anton;font-weight:400;font-size:86px;letter-spacing:2px}
/* definition */
.def{width:880px;background:rgba(6,12,22,.93);border-left:12px solid #FFD21F;border-radius:20px;padding:16px 26px 20px;box-shadow:0 18px 44px rgba(0,0,0,.55);color:#fff}
.def .k{font-family:JB;font-weight:800;font-size:18px;color:#FFD21F;letter-spacing:3px}
.def .t{font-family:Anton;font-size:58px;line-height:1.05;margin-top:2px;color:#fff;letter-spacing:1px}
.def .d{font-weight:700;font-size:28px;line-height:1.22;color:#D6E4F0;margin-top:6px}
/* tip (prescription) */
.tip{width:920px;background:#fff;border-radius:30px;box-shadow:0 22px 56px rgba(0,0,0,.6);color:var(--ink);overflow:hidden}
.tipH{display:flex;align-items:center;gap:14px;padding:22px 28px 18px;background:linear-gradient(90deg,#0F1216,#1E293B);color:#fff}
.tipH img{width:64px;height:64px}
.tipH .a{font-family:JB;font-weight:800;font-size:20px;letter-spacing:3px;color:#FFD21F}
.tipH .b{font-weight:900;font-size:42px;line-height:1.05}
.tipH .rx{margin-left:auto;font-family:Anton;font-size:84px;color:#E11D2E;line-height:1}
.tRow{display:flex;align-items:center;gap:18px;padding:18px 28px;border-top:3px solid #EEF0F3;font-weight:900;font-size:33px;line-height:1.15;opacity:0}
.tRow img{width:56px;height:56px;flex:none}
/* callouts */
.cl{display:none;padding:10px 18px 12px 16px;background:rgba(6,12,22,.9);border:3px solid var(--cyan);border-radius:14px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.5);white-space:nowrap}
.cl .h{font-family:JB;font-weight:800;font-size:17px;letter-spacing:2.5px;color:var(--cyan);text-transform:uppercase}
.cl .v{font-family:JB;font-weight:800;font-size:31px;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}

<script>
const FPS = TL.fps;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = (p, s = 1.9) => { const c = s + 1; return 1 + c * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const WORDS = TL.words;
function Wd(win, text, nth = 0) {
  const n = norm(text); const c = WORDS.filter(w => w.win === win && norm(w.text) === n);
  if (!c[nth]) throw new Error('anchor not found: ' + win + ' ' + text + ' #' + nth); return c[nth];
}
const aw = (win, x, k) => Wd(win, x, k).os, ew = (win, x, k) => Wd(win, x, k).oe;
function CWd(text, nth = 0) { const n = norm(text); const c = TL.cold_words.filter(w => norm(w.text) === n); if (!c[nth]) throw new Error('cold anchor not found: ' + text); return c[nth]; }
const cw = (x, k) => CWd(x, k).os, cwe = (x, k) => CWd(x, k).oe;
const S0 = TL.story_out0, SEND = TL.story_end, TEND = TL.tip_end || TL.story_end, TOTAL = TL.total;
const HAS_COLD = TL.cold_words.length > 0;
const INTRO = TL.intro || null, HS = INTRO ? INTRO.dur : 0;  // synthetic intro hook (intro.js): the clip and its own hook start at HS

// ===================== PER-REEL config (reel.js) =====================
let CFG = { hook: null, stages: null, items: [], fx: [], tags: {}, sfx: [], bursts: [] }, SCENES_OK = true;
try { CFG = Object.assign(CFG, window.REEL_CFG({ aw, ew, cw, cwe, S0, SEND, TEND, TOTAL, HOOK_END, WORDS })); }
catch (e) { SCENES_OK = false; console.warn('scenes disabled: ' + e.message); window.CFG_ERR = String(e.message); }

const img = n => `<img src="assets/emoji/${n}.png" alt="">`;
const ck = (txt, bad) => `<div class="box${bad ? ' bad' : ''}"><div class="fill"></div><svg width="52" height="52" viewBox="0 0 54 54"><path d="${bad ? 'M 15 15 L 39 39 M 39 15 L 15 39' : 'M 11 28 L 23 40 L 44 15'}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="${bad ? 2 : 1}" stroke-dasharray="${bad ? 2 : 1}" stroke-dashoffset="${bad ? 2 : 1}"/></svg></div><span>${txt}</span>`;
$('sIco').innerHTML = `<svg viewBox="-80 -80 160 160" width="150" height="150"><circle id="sRing" r="74" fill="none" stroke="#E11D2E" stroke-width="5" opacity=".4"/><circle r="64" fill="#E11D2E"/>
 <g id="sArrow"><path d="M -34 26 C -34 -6 -8 -22 20 -22 L 20 -42 L 52 -8 L 20 26 L 20 6 C -2 6 -20 12 -34 26 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g></svg>`;
{ // map (end card)
  const M = TL.map; const pin = (x, y, id) => `<g id="${id}" transform="translate(${x} ${y})"><g class="pinG"><path d="M 0 0 C -7 -16 -26 -28 -26 -46 A 26 26 0 1 1 26 -46 C 26 -28 7 -16 0 0 Z" fill="#E11D2E" stroke="#fff" stroke-width="5"/><circle cx="0" cy="-46" r="9" fill="#fff"/></g></g>`;
  const lblPos = { 'GALAȚI': [34, -40, 'start'], 'BUCUREȘTI': [0, 50, 'middle'], 'IAȘI': [34, -46, 'start'], 'PIATRA NEAMȚ': [-34, -46, 'end'] };
  let pins = '', lbls = '', halos = '';
  M.cities.forEach((c, i) => { const [dx, dy, an] = lblPos[c.name];
    halos += `<circle id="halo${i}" cx="${c.x}" cy="${c.y}" r="10" fill="none" stroke="#FFD21F" stroke-width="5"/>`;
    pins += pin(c.x, c.y, 'pin' + i); lbls += `<text id="lbl${i}" class="cityLbl" x="${c.x + dx}" y="${c.y + dy}" text-anchor="${an}">${c.name}</text>`; });
  $('eMap').innerHTML = `<svg viewBox="-10 -10 ${M.w + 20} ${M.h + 20}" width="640" height="447" style="overflow:visible"><path d="${M.path}" fill="rgba(255,255,255,.10)" stroke="#E5E7EB" stroke-width="5" stroke-linejoin="round"/>${halos}${pins}${lbls}</svg>`;
}
const SPARK_N = 12; const sparks = [];
for (let i = 0; i < SPARK_N; i++) { const im = document.createElement('img'); im.src = 'assets/emoji/sparkles.png'; im.className = 'abs spark emo'; $('sparks').appendChild(im); sparks.push(im); }
const GL_N = 8; const gls = [];
for (let i = 0; i < GL_N; i++) { const d = document.createElement('div'); d.className = 'gs'; $('glitch').appendChild(d); gls.push(d); }

// ---------- transforms ----------
function setT(el, x, y, s = 1, r = 0, o = 1) {
  if (o <= 0.003 || s <= 0.003) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const disp = el.dataset.disp || 'block'; if (el.style.display !== disp) el.style.display = disp;
  el.style.opacity = o.toFixed(3);
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
}
function setTop(el, x, y, s = 1, o = 1) {
  if (o <= 0.003 || s <= 0.003) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const disp = el.dataset.disp || 'block'; if (el.style.display !== disp) el.style.display = disp;
  el.style.opacity = o.toFixed(3); el.style.transformOrigin = '50% 0';
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,0) scale(${s.toFixed(4)})`;
}
['hTag', 'hCar', 'hookChips', 'stg'].forEach(id => $(id).dataset.disp = 'flex');
const hide = el => { if (el.style.display !== 'none') el.style.display = 'none'; };
function life(t, t0, t1, inD = .36, outD = .22, back = 1.9) {
  if (t < t0 || t > t1 + outD) return null;
  let s = 1, o = 1; const k = t - t0;
  if (k < inD) { const p = k / inD; s = eBack(p, back); o = clamp(p * 4); }
  if (t > t1) { const p = (t - t1) / outD; s *= 1 - .3 * eIn(p); o *= 1 - p; }
  return { s, o, k };
}
const bob = (k, seed = 0, a = 6) => Math.sin(k * 2.3 + seed) * a;
function status(el, html, color) { if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } el.style.color = color; }
function rowIn(el, t, ts) { const p = clamp((t - ts) / .3); el.style.opacity = eOut(p).toFixed(3); el.style.transform = `translateX(${((1 - eOut(p)) * -30).toFixed(1)}px)`; return p; }
function popIn(el, t, ts, s = 2.2) { const p = clamp((t - ts) / .3); el.style.opacity = eOut(p).toFixed(3); el.style.transform = `scale(${p > 0 ? eBack(p, s).toFixed(4) : 0})`; return p; }
function checkRow(row, t, ts, bad) { const p = clamp((t - ts) / .3);
  row.querySelector('.fill').style.transform = `scale(${p > 0 ? eBack(p, 2) : 0})`;
  row.querySelector('path').setAttribute('stroke-dashoffset', ((bad ? 2 : 1) * (1 - eOut(clamp((t - ts - .1) / .25)))).toFixed(3));
  row.querySelector('.box').style.borderColor = p > 0 ? (bad ? '#E11D2E' : '#16A34A') : '#CBD2D9'; row.style.color = p > 0 ? (bad ? '#B91C1C' : '#0F1216') : '#9AA3AD'; return p; }
function typeText(el, txt, t, ts, cps = 38) { // typewriter (mono labels)
  const n = Math.max(0, Math.min(txt.length, Math.floor((t - ts) * cps)));
  const s = n >= txt.length ? txt : txt.slice(0, n) + (Math.floor(t * 6) % 2 ? '▌' : ' ');
  if (el.dataset.s !== s) { el.textContent = s; el.dataset.s = s; }
}

// ---------- SFX / bursts ----------
window.SFX = [];
const sfx = (t, kind, gain = 1) => { if (t >= 0) window.SFX.push({ t: +t.toFixed(3), kind, gain }); };
const BURSTS = [];
function burst(t0, cx, cy, n, rad, size = 1) { BURSTS.push({ t0, cx, cy, n, rad, size }); }
function renderSparks(t) {
  let used = 0;
  for (const b of BURSTS) { const k = t - b.t0; if (k < 0 || k > 1.4) continue;
    for (let i = 0; i < b.n && used < SPARK_N; i++, used++) { const kk = k - i * .07; const el = sparks[used];
      if (kk < 0 || kk > 1) { hide(el); continue; }
      const ang = (i * 137.5) * Math.PI / 180, rr = b.rad * (.55 + .45 * ((i * 53) % 10) / 10), p = kk;
      setT(el, b.cx + Math.cos(ang) * rr, b.cy + Math.sin(ang) * rr - p * 26, Math.sin(p * Math.PI) * b.size, p * 40, 1); } }
  for (let i = used; i < SPARK_N; i++) hide(sparks[i]);
}

// ---------- captions (semantic colours) ----------
const AUTO = {
  r: 'pierderi pierdere pierderile pierderilor defazata defazat sarit nemaipornind porneste pornit underboost overboost topit crapat problema probleme problemele defect defecta defecte defectiune uzat uzata uzate uzura fisurat fisura rupt rupta spart sparta fum fumul pierde joc jocul zgomot zgomote fluiera fluierat suiera avarie avariat infundat infundata colmatat colmatata blocat blocata blocate gripat gripata ars arsa topita crapata ulei uleiul murdar murdara murdarie depuneri calamina cocs carbon frecat frecare lovit lovita lovituri ciupit ciupite indoit indoite deformat deformata cedat cedeaza scapa scurgeri scurgere avariata avariate distrus distrusa distruse grav periculos pericol eroare erori martor martorul limp avaria praf supraincalzire supraincalzirea incins incinsa zgariat neregulat deteriorat beton greu grea excesiv'.split(' '),
  g: 'reparat reparata reparate reconditionat reconditionata reconditionate reconditionare curatat curatata curatate curatare nou noua noi rezolvat rezolvata rezolvare gata perfect perfecta impecabil garantie functioneaza functionat echilibrat echilibrata echilibrare testat testata testare verificat verificata calibrat calibrata calibrare montat montata ok bine sanatos sanatoasa vindecat salvat salvata recuperat economie protejat original originala originale inlocuire inlocuit inlocuita remontare predare'.split(' '),
  c: 'antigel radiator radiatorul inverterului invertorului vasul vase expansiune garnitura chiulasa injectie injectiei injectii injectia lant lantul distributie distributia distributiei intinzator intinzatorul chiuloasa cilindri cilindrul cilindrului piston pistonul pistoane bucsa clapeta wastegate banut banuti banutul turbo turbina turbinei turbine turbosuflanta turbosuflante turbosuflantei turbosuflantelor turbocompresor injector injectoare injectorul injectoarele injectorului dpf filtru filtrul filtrului particule egr actuator actuatorul actuatorului geometrie geometria geometriei ax axul axe axelor rotor rotorul carcasa carcasei cartus cartusul miez miezul cma chra compresor compresorului rulment rulmenti lagar lagare segment segmenti intercooler admisie admisia evacuare evacuarea motor motorul motorului pompa pompei rampa supapa supapa supape senzor senzorul vacuum vacumatic electronic electronica bobina etansare garnitura garnituri paleta palete paletele fulie diesel came tacheti cuzineti semeringuri anexele bloc'.split(' '),
};
const AUTO_MAP = {}; Object.entries(AUTO).forEach(([c, ws]) => ws.forEach(w => AUTO_MAP[w] = c));
function capClass(w) {
  if (w._brand) return 'y';
  const n = norm(w.text); const o = (CFG.tags[w.win] || {})[n]; if (o !== undefined) return o;
  if (/[0-9]/.test(w.text)) return 'y'; return AUTO_MAP[n] || '';
}
const HIDE_CAP = [[0, HAS_COLD ? S0 + 0.05 : 0], [SEND, 1e9]].concat(CFG.hideCap || []);
let CHUNKS = [];
function buildChunks() {
  WORDS.forEach((w, i) => { const nx = WORDS[i + 1]; if (nx && norm(w.text) === 'turbo' && norm(nx.text).startsWith('doctor')) { w._brand = nx._brand = true; } });
  const cv = document.createElement('canvas').getContext('2d'); cv.font = '900 80px Mont';
  const width = s => cv.measureText(s.toUpperCase()).width + 36; const MAXW = 840; let cur = null;
  WORDS.forEach((w, i) => {
    const prev = WORDS[i - 1];
    const brk = !cur || cur.words.length >= 3 || (prev && /[.,?!:]$/.test(prev.text)) || (prev && w.os - prev.oe > 0.35) || cur.w + width(w.text) > MAXW || (prev && prev.win !== w.win);
    if (brk) { cur = { words: [], w: 0, win: w.win }; CHUNKS.push(cur); }
    cur.words.push(w); cur.w += width(w.text);
  });
  CHUNKS.forEach((c, i) => { c.t0 = c.words[0].os - 0.05; const nx = CHUNKS[i + 1]; c.t1 = Math.min(nx ? nx.words[0].os - 0.05 : 1e9, c.words[c.words.length - 1].oe + 0.3); });
}
let capCur = -1;
function renderCaptions(t) {
  const cap = $('cap'); const hidden = HIDE_CAP.some(([a, b]) => t >= a && t < b);
  const idx = CHUNKS.findIndex(c => t >= c.t0 && t < c.t1 && (c.win < 0 ? !(CFG.intro && CFG.intro.cap === false) : !hidden));
  if (idx !== capCur) { capCur = idx; if (idx < 0) { cap.innerHTML = ''; return; }
    cap.innerHTML = CHUNKS[idx].words.map(w => `<span class="${capClass(w)}">${w.text.replace(/[.,?!:]$/, '')}</span>`).join(''); }
  if (idx < 0) return;
  const c = CHUNKS[idx]; const p = clamp((t - c.t0) / 0.13);
  cap.style.transform = `translateY(${(1 - eOut(p)) * 24}px) scale(${lerp(.86, 1, eBack(p, 2.2))})`; cap.style.opacity = clamp(p * 3);
  c.words.forEach((w, j) => { const sp = cap.children[j]; const on = t >= w.os - 0.03 && t < Math.max(w.oe, w.os + 0.16); sp.classList.toggle('on', on);
    const d = t - w.os; const pp = (d >= -0.03 && d < 0.26) ? Math.sin(clamp((d + .03) / .29) * Math.PI) : 0; sp.style.transform = `scale(${(1 + .14 * pp * Math.min(1, 7 / Math.max(1, w.text.length))).toFixed(3)})`; });
}

// ---------- stage progress bar ----------
const CHECK = '<svg width="16" height="16" viewBox="0 0 20 20"><path d="M 4 10.5 L 8.5 15 L 16 5.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setupStages() {
  const S = CFG.stages; if (!S) return;
  $('stg').innerHTML = S.map((s, i) => (i ? `<div class="sgLine"><div class="sgFill" id="sgF${i}"></div></div>` : '') +
    `<div class="sg" id="sg${i}"><div class="sgDot">${CHECK}<div class="sgRing" id="sgR${i}"></div></div><span>${s[1]}</span></div>`).join('');
  S.forEach((s, i) => { sfx(s[0], i ? 'lock' : 'tick2', .5); });
}
function rStages(t) {
  const S = CFG.stages, el = $('stg'); if (!S) return;
  const a = Math.max(S0, S[0][0] - .4), b = SEND;
  if (t < a || t > b + .3) { hide(el); return; }
  let cur = -1; S.forEach((s, i) => { if (t >= s[0]) cur = i; });
  S.forEach((s, i) => { const n = $('sg' + i); const cls = 'sg' + (i < cur ? ' done' : i === cur ? ' cur' : ''); if (n.className !== cls) n.className = cls;
    const dot = n.querySelector('.sgDot'); const pk = t - s[0];
    dot.style.transform = (pk >= 0 && pk < .35) ? `scale(${eBack(clamp(pk / .35), 3).toFixed(3)})` : 'none';
    const r = $('sgR' + i); if (i === cur) { const q = ((t - s[0]) % 1.1) / 1.1; r.style.opacity = (0.8 * (1 - q)).toFixed(2); r.style.transform = `scale(${(1 + q * 1.1).toFixed(2)})`; } else r.style.opacity = 0;
    if (i) { const f = $('sgF' + i); f.style.width = (100 * clamp((t - (s[0] - .35)) / .35)).toFixed(1) + '%'; } });
  const o = clamp((t - a) / .3) * (1 - clamp((t - b) / .3));
  setT(el, 540, CFG.stageY || 222, lerp(.85, 1, eOut(clamp((t - a) / .35))), 0, o);
}

// ---------- background + highlight-only colour effects ----------
const STORY = TL.segments.filter(s => s.kind === 'story');
const SPEED = TL.speed || 1;
const BGX = { z: 1, dx: 0, dy: 0 };
