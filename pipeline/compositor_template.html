<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><title>Turbo Doctor Reel Compositor (medical)</title>
<style>
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_600SemiBold.ttf);font-weight:600}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_700Bold.ttf);font-weight:700}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_800ExtraBold.ttf);font-weight:800}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat_900Black.ttf);font-weight:900}
@font-face{font-family:Anton;src:url(assets/fonts/Anton_400Regular.ttf)}
:root{--ink:#0F1216;--muted:#6B7480;--red:#FF3B3B;--red2:#E11D2E;--green:#22C55E;--green2:#15803D;--yellow:#FFD21F;--cyan:#62D8FF;--fire:#FF6B1A;--paper:#FFFDF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:Mont}
/* NO permanent colour filter on the footage: colour effects only on highlighted moments (fx list) */
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
#tintR{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,40,40,.06),rgba(150,0,0,.62));opacity:0}
#tintG{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(60,255,140,.04),rgba(0,110,50,.55));opacity:0}
#scan{position:absolute;left:0;top:0;width:1080px;height:70px;background:linear-gradient(to bottom,rgba(98,216,255,0),rgba(98,216,255,.55) 70%,#E6FAFF 86%,rgba(98,216,255,0));display:none}
#vig{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.30) 0,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 82%,rgba(0,0,0,.26) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
.abs{position:absolute;left:0;top:0;display:none;will-change:transform,opacity}
.emo{filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.card{background:#fff;border-radius:30px;box-shadow:0 18px 44px rgba(0,0,0,.5);color:var(--ink)}
.cTitle{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:28px;letter-spacing:.5px;line-height:1.1;white-space:nowrap}
.cTitle img{width:46px;height:46px}
.status{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:30px;height:44px;margin-top:8px;white-space:nowrap}
.status img{width:42px;height:42px}
.chip{display:none;align-items:center;gap:12px;padding:10px 28px 10px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:900;font-size:34px;letter-spacing:.5px;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.5);border:3px solid #fff}
.chip img{width:52px;height:52px}
.chip.red{background:var(--red2)}.chip.green{background:#16A34A}.chip.yellow{background:var(--yellow);color:var(--ink)}.chip.blue{background:#0369A1}
#cap{position:absolute;left:80px;width:860px;top:1290px;height:240px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;text-align:center;font-weight:900;font-size:80px;line-height:1.08;text-transform:uppercase;letter-spacing:-.5px}
#cap span{display:inline-block;margin:0 18px;color:#fff;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 7px 0 rgba(0,0,0,.6),0 12px 28px rgba(0,0,0,.55);transform-origin:50% 60%}
#cap span.r{color:#FF4B4B}#cap span.g{color:#4ADE80}#cap span.c{color:var(--cyan)}#cap span.y{color:var(--yellow)}
#cap span.on{color:var(--yellow)}#cap span.on.r{color:#FF6B6B}#cap span.on.g{color:#86EFAC}#cap span.on.c{color:#A5E9FF}#cap span.on.y{color:#FFE88A}
#chap{display:none;align-items:center;gap:10px;padding:9px 24px 9px 12px;border-radius:999px;background:rgba(10,12,16,.78);border:3px solid rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:25px;letter-spacing:3px;white-space:nowrap;transform-origin:0 50%}
#chap img{width:42px;height:42px}
/* hook */
#hookPill{display:none;align-items:center;gap:12px;background:var(--red2);color:#fff;font-weight:900;font-size:30px;letter-spacing:2px;padding:8px 28px 8px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.5);border:3px solid #fff}
#hookPill img{width:50px;height:50px}
.hookTxt{font-family:Anton;line-height:1;white-space:nowrap;-webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 8px 0 #000,0 14px 30px rgba(0,0,0,.6);letter-spacing:1px;text-align:center}
#hookL1{font-size:106px;color:#fff}
.hookTxt .y{color:var(--yellow)}.hookTxt .r{color:#FF3B30}.hookTxt .g{color:#4ADE80}.hookTxt .c{color:var(--cyan)}.hookTxt .w{color:#fff}
#hookL2{font-size:160px;color:#FF3B30}
#hookChips{display:none;gap:16px}
.hChip{display:flex;align-items:center;gap:8px;padding:8px 22px 8px 10px;border-radius:999px;background:#fff;color:var(--red2);font-weight:900;font-size:36px;border:4px solid var(--red2);box-shadow:0 10px 24px rgba(0,0,0,.5);opacity:0;white-space:nowrap}
.hChip img{width:46px;height:46px}
/* patient file */
.fisa{width:680px;background:var(--paper);border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.55);color:var(--ink);padding:0 0 14px;overflow:visible}
.fClip{position:absolute;left:50%;top:-22px;width:150px;height:44px;margin-left:-75px;border-radius:12px;background:linear-gradient(#9AA3AD,#5B6470);border:4px solid #2C323A;box-shadow:0 6px 10px rgba(0,0,0,.35)}
.fClip:after{content:'';position:absolute;left:50%;top:9px;width:36px;height:14px;margin-left:-18px;border-radius:8px;background:#1F242B}
.fHead{display:flex;align-items:center;gap:12px;background:var(--red2);color:#fff;border-radius:26px 26px 0 0;padding:26px 24px 14px;font-weight:900;font-size:30px;letter-spacing:1.5px;white-space:nowrap}
.fHead img{width:46px;height:46px}
.fHead .fNo{margin-left:auto;font-weight:800;font-size:22px;letter-spacing:2px;opacity:.85}
.fRow{display:none;align-items:center;gap:14px;margin:0 22px;padding:11px 2px;border-bottom:3px dashed #E5E1D5;opacity:0}
.fRow:last-of-type{border-bottom:none}
.fL{width:182px;flex:none;font-weight:800;font-size:21px;letter-spacing:2.5px;color:#8A8F98}
.fV{flex:1;font-weight:900;font-size:33px;line-height:1.08;color:var(--ink)}
.fV.r{color:#C81E2C}.fV.g{color:#15803D}.fV.c{color:#0E6E8C}.fV.y{color:#B45309}
.fV img{width:40px;height:40px;vertical-align:-8px;margin-right:6px}
.fStamp{position:absolute;right:20px;bottom:-96px;font-family:Anton;font-size:52px;letter-spacing:3px;padding:2px 18px 0;border:6px solid;border-radius:12px;opacity:0;transform-origin:50% 50%;background:rgba(255,255,255,.75)}
/* checklist / treatment */
.ckRow{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:3px solid #EEF0F3;font-weight:900;font-size:31px;color:#9AA3AD;white-space:nowrap}
.ckRow:last-of-type{border-bottom:none}
.box{width:52px;height:52px;border-radius:14px;border:5px solid #CBD2D9;flex:none;position:relative;overflow:hidden}
.box .fill{position:absolute;inset:0;background:var(--green);border-radius:9px;transform:scale(0)}
.box.bad .fill{background:var(--red2)}
.box svg{position:absolute;left:-1px;top:-1px}
/* ecg monitor */
.ecgBox{width:640px;background:#0B1015;border-radius:26px;border:4px solid #2B3540;box-shadow:0 18px 44px rgba(0,0,0,.6);padding:14px 18px 12px;color:#fff}
.eTop{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:26px;letter-spacing:2px;white-space:nowrap}
.eTop img{width:40px;height:40px;vertical-align:-10px;margin-right:8px}
.eVal{padding:4px 16px;border-radius:999px;font-size:24px}
.ecgSvg{display:block;margin-top:8px;border-radius:14px;background-image:linear-gradient(rgba(74,222,128,.10) 2px,transparent 2px),linear-gradient(90deg,rgba(74,222,128,.10) 2px,transparent 2px);background-size:40px 40px;background-color:#05080B}
/* stat / odometer */
.odo{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:16px auto 6px;background:#11151A;border-radius:20px;padding:14px 28px 10px;width:max-content;box-shadow:inset 0 4px 10px rgba(0,0,0,.6)}
.odo .dg{font-family:Anton;font-size:100px;line-height:1;color:#fff;letter-spacing:3px}
.odo .un{font-family:Anton;font-size:46px;line-height:1.2;color:#9AA3AD;margin-bottom:8px}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:26px;color:var(--muted);letter-spacing:1.5px;margin-top:6px;white-space:nowrap}
.sub img{width:38px;height:38px}
/* compare */
.mCols{display:flex;gap:14px;margin-top:14px}
.mCol{flex:1;border-radius:22px;padding:14px 10px 16px;text-align:center;border:5px solid;opacity:0}
.mCol .h{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:24px;letter-spacing:2px}
.mCol .h img{width:40px;height:40px}
.mCol .v{font-weight:900;font-size:33px;line-height:1.1;margin-top:8px}
.mCol .v.big{font-family:Anton;font-weight:400;font-size:76px;line-height:1.05}
.mCol.bad{background:#FEE2E2;border-color:#E11D2E;color:#B91C1C}
.mCol.ok{background:#DCFCE7;border-color:#16A34A;color:#15803D}
/* illustration (B-roll art) */
.artWrap{position:relative;height:230px;margin-top:6px;display:flex;justify-content:center}
.artWrap svg{height:230px;width:auto}
.artX{position:absolute;right:90px;top:20px;width:96px;height:96px;opacity:0}
/* stamp */
.stamp{font-family:Anton;font-size:96px;letter-spacing:4px;line-height:1;padding:10px 30px 4px;border:10px solid;border-radius:18px;background:rgba(255,255,255,.88);white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.stamp.red{color:#D3172A;border-color:#D3172A}.stamp.green{color:#15803D;border-color:#15803D}.stamp.blue{color:#0369A1;border-color:#0369A1}
/* end card (unchanged) */
#endCard{width:1080px;height:1920px}
#endCard .eWord{position:absolute;left:0;right:0;top:196px;text-align:center;font-family:Anton;font-size:104px;line-height:1;color:#fff;letter-spacing:2px;text-shadow:0 10px 30px rgba(0,0,0,.6)}
#endCard .eWord .y{color:var(--yellow)}
#eShare{position:absolute;left:90px;width:900px;top:330px;height:236px;border-radius:40px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;align-items:center;gap:26px;padding:0 34px;color:var(--ink)}
#eShare .sIco{width:150px;height:150px;flex:none}
#eShare .sT1{font-weight:900;font-size:50px;line-height:1.02}
#eShare .sT2{display:flex;align-items:center;gap:10px;font-weight:800;font-size:33px;color:#4B5563;margin-top:10px}
#eShare .sT2 img{width:48px;height:48px}
#eMap{position:absolute;left:220px;top:612px;width:640px;height:447px}
#eMapTitle{position:absolute;left:0;right:0;top:1066px;text-align:center;font-weight:800;font-size:26px;letter-spacing:4px;color:#CBD5E1}
#eFree{position:absolute;left:230px;width:620px;top:1112px;height:88px;border-radius:999px;background:#16A34A;border:5px solid #fff;color:#fff;font-weight:900;font-size:42px;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 14px 34px rgba(0,0,0,.55);white-space:nowrap}
#eFree img{width:54px;height:54px}
#ePhone{position:absolute;left:190px;width:700px;top:1220px;height:112px;border-radius:999px;background:var(--yellow);color:var(--ink);font-weight:900;font-size:62px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 16px 38px rgba(0,0,0,.55);letter-spacing:1px;white-space:nowrap}
#ePhone img{width:70px;height:70px}
#eUrl{position:absolute;left:0;right:0;top:1352px;text-align:center;font-weight:900;font-size:44px;color:#fff;letter-spacing:1px}
.cityLbl{font-family:Mont;font-weight:900;font-size:34px;fill:#fff;paint-order:stroke;stroke:#0B0F14;stroke-width:9px;stroke-linejoin:round;letter-spacing:1px}
.spark{width:90px;height:90px}
</style>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="reel.js"></script>
</head>
<body>
<div id="stage">
 <img id="bg" alt="">
 <div id="tintR"></div>
 <div id="tintG"></div>
 <div id="scan"></div>
 <div id="vig"></div>
 <div id="chap" class="abs"><img id="chapIco" alt=""><span id="chapTxt"></span></div>

 <!-- HOOK -->
 <div id="hookPill" class="abs"><img id="hookPillIco" alt=""><span id="hookPillTxt"></span></div>
 <div id="hookL1" class="abs hookTxt"></div>
 <div id="hookL2" class="abs hookTxt"></div>
 <div id="hookChips" class="abs"></div>
 <img id="hookStk1" class="abs emo" alt="" style="width:120px;height:120px">
 <img id="hookStk2" class="abs emo" alt="" style="width:130px;height:130px">

 <div id="items"></div>
 <svg id="ringSvg" class="abs" viewBox="0 0 1080 1920" width="1080" height="1920" style="display:none">
  <circle id="ringA" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="20"/><circle id="ringB" fill="none" stroke="#62D8FF" stroke-width="10"/>
  <path id="ringLn" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
 </svg>
 <div id="ringChip" class="chip abs"><img alt=""><span></span></div>
 <div id="sparks"></div>
 <div id="cap"></div>

 <!-- END CARD (standard, unchanged) -->
 <div id="endCard" class="abs">
  <div class="eWord">TURBO <span class="y">DOCTOR</span></div>
  <div id="eShare"><div class="sIco" id="sIco"></div><div><div class="sT1">DISTRIBUIE ACEST VIDEO</div><div class="sT2">unui prieten care ar avea nevoie!<img src="assets/emoji/folded_hands.png" alt=""></div></div></div>
  <div id="eMap"></div>
  <div id="eMapTitle">UNITĂȚILE NOASTRE</div>
  <div id="eFree"><img src="assets/emoji/stethoscope.png" alt="">DIAGNOZĂ GRATUITĂ</div>
  <div id="ePhone"><img src="assets/emoji/phone.png" alt="">0739 065 065</div>
  <div id="eUrl">turbodoctor.ro</div>
 </div>
 <div id="flash"></div>
</div>

<script>
const FPS = TL.fps;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eIn = p => p * p * p;
const eInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eBack = (p, s = 1.9) => { const c = s + 1; return 1 + c * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const WORDS = TL.words;
function Wd(win, text, nth = 0) {
  const n = norm(text); const c = WORDS.filter(w => w.win === win && norm(w.text) === n);
  if (!c[nth]) throw new Error('anchor not found: ' + win + ' ' + text + ' #' + nth); return c[nth];
}
const aw = (win, x, k) => Wd(win, x, k).os, ew = (win, x, k) => Wd(win, x, k).oe;
function CWd(text, nth = 0) { const n = norm(text); const c = TL.cold_words.filter(w => norm(w.text) === n); if (!c[nth]) throw new Error('cold anchor not found: ' + text); return c[nth]; }
const cw = (x, k) => CWd(x, k).os, cwe = (x, k) => CWd(x, k).oe;
const S0 = TL.story_out0, SEND = TL.story_end, TOTAL = TL.total;
const HAS_COLD = TL.cold_words.length > 0;
const HOOK_END = HAS_COLD ? S0 : Math.min(3.0, SEND);

// ===================== PER-REEL config (reel.js) =====================
let CFG = { hook: null, items: [], fx: [], chaps: [], tags: {}, sfx: [], bursts: [] }, SCENES_OK = true;
try { CFG = Object.assign(CFG, window.REEL_CFG({ aw, ew, cw, cwe, S0, SEND, TOTAL, HOOK_END, WORDS })); }
catch (e) { SCENES_OK = false; console.warn('scenes disabled: ' + e.message); window.CFG_ERR = String(e.message); }

const ck = (txt, bad) => `<div class="box${bad ? ' bad' : ''}"><div class="fill"></div><svg width="52" height="52" viewBox="0 0 54 54"><path d="${bad ? 'M 15 15 L 39 39 M 39 15 L 15 39' : 'M 11 28 L 23 40 L 44 15'}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="${bad ? 2 : 1}" stroke-dasharray="${bad ? 2 : 1}" stroke-dashoffset="${bad ? 2 : 1}"/></svg></div><span>${txt}</span>`;
$('sIco').innerHTML = `<svg viewBox="-80 -80 160 160" width="150" height="150"><circle id="sRing" r="74" fill="none" stroke="#E11D2E" stroke-width="5" opacity=".4"/><circle r="64" fill="#E11D2E"/>
 <g id="sArrow"><path d="M -34 26 C -34 -6 -8 -22 20 -22 L 20 -42 L 52 -8 L 20 26 L 20 6 C -2 6 -20 12 -34 26 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g></svg>`;
{ // map
  const M = TL.map; const pin = (x, y, id) => `<g id="${id}" transform="translate(${x} ${y})"><g class="pinG"><path d="M 0 0 C -7 -16 -26 -28 -26 -46 A 26 26 0 1 1 26 -46 C 26 -28 7 -16 0 0 Z" fill="#E11D2E" stroke="#fff" stroke-width="5"/><circle cx="0" cy="-46" r="9" fill="#fff"/></g></g>`;
  const lblPos = { 'GALAȚI': [34, -40, 'start'], 'BUCUREȘTI': [0, 50, 'middle'], 'IAȘI': [34, -46, 'start'], 'PIATRA NEAMȚ': [-34, -46, 'end'] };
  let pins = '', lbls = '', halos = '';
  M.cities.forEach((c, i) => { const [dx, dy, an] = lblPos[c.name];
    halos += `<circle id="halo${i}" cx="${c.x}" cy="${c.y}" r="10" fill="none" stroke="#FFD21F" stroke-width="5"/>`;
    pins += pin(c.x, c.y, 'pin' + i); lbls += `<text id="lbl${i}" class="cityLbl" x="${c.x + dx}" y="${c.y + dy}" text-anchor="${an}">${c.name}</text>`; });
  $('eMap').innerHTML = `<svg viewBox="-10 -10 ${M.w + 20} ${M.h + 20}" width="640" height="447" style="overflow:visible"><path d="${M.path}" fill="rgba(255,255,255,.10)" stroke="#E5E7EB" stroke-width="5" stroke-linejoin="round"/>${halos}${pins}${lbls}</svg>`;
}
const SPARK_N = 12; const sparks = [];
for (let i = 0; i < SPARK_N; i++) { const im = document.createElement('img'); im.src = 'assets/emoji/sparkles.png'; im.className = 'abs spark emo'; $('sparks').appendChild(im); sparks.push(im); }

function setT(el, x, y, s = 1, r = 0, o = 1) {
  if (o <= 0.003 || s <= 0.003) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
  const disp = el.dataset.disp || 'block'; if (el.style.display !== disp) el.style.display = disp;
  el.style.opacity = o.toFixed(3);
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
}
['chap', 'hookPill', 'hookChips', 'ringChip'].forEach(id => $(id).dataset.disp = 'flex');
const hide = el => { if (el.style.display !== 'none') el.style.display = 'none'; };
function life(t, t0, t1, inD = .36, outD = .22, back = 1.9) {
  if (t < t0 || t > t1 + outD) return null;
  let s = 1, o = 1; const k = t - t0;
  if (k < inD) { const p = k / inD; s = eBack(p, back); o = clamp(p * 4); }
  if (t > t1) { const p = (t - t1) / outD; s *= 1 - .3 * eIn(p); o *= 1 - p; }
  return { s, o, k };
}
const bob = (k, seed = 0, a = 6) => Math.sin(k * 2.3 + seed) * a;
function status(el, html, color) { if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; } el.style.color = color; }
function rowIn(el, t, ts) { const p = clamp((t - ts) / .3); el.style.opacity = eOut(p).toFixed(3); el.style.transform = `translateX(${((1 - eOut(p)) * -30).toFixed(1)}px)`; return p; }
function popIn(el, t, ts, s = 2.2) { const p = clamp((t - ts) / .3); el.style.opacity = eOut(p).toFixed(3); el.style.transform = `scale(${p > 0 ? eBack(p, s).toFixed(4) : 0})`; return p; }
function checkRow(row, t, ts, bad) { const p = clamp((t - ts) / .3);
  row.querySelector('.fill').style.transform = `scale(${p > 0 ? eBack(p, 2) : 0})`;
  row.querySelector('path').setAttribute('stroke-dashoffset', ((bad ? 2 : 1) * (1 - eOut(clamp((t - ts - .1) / .25)))).toFixed(3));
  row.querySelector('.box').style.borderColor = p > 0 ? (bad ? '#E11D2E' : '#16A34A') : '#CBD2D9'; row.style.color = p > 0 ? (bad ? '#B91C1C' : '#0F1216') : '#9AA3AD'; return p; }

// ---------- SFX / bursts ----------
window.SFX = [];

    const sw = ph === o.ph[0] ? 1 : lerp(.75, 1, eBack(clamp((t - ph[0]) / .25), 2.4));

  }
  if (o.k === 'stamp') {

    const k = t - o.t; const p = clamp(k / .16); const s = k < .16 ? lerp(2.4, 1, eIn(p)) : 1 + .04 * Math.exp(-(k - .16) * 10) * Math.sin((k - .16) * 40);
    setT(el, o.x || 540, o.y || 640, s * (o.s || 1), o.rot ?? -9, clamp(p * 3) * (1 - clamp((t - t1) / .25)) * .96); return;
  }
  if (o.k === 'stk') { const L = life(t, o.t0, o.t1, .3, .2, 2.6); if (!L) { hide(el); return; } setT(el, o.x, o.y + bob(L.k, 1, 7), L.s, (o.rot || 0) + Math.sin(L.k * 3) * 6, L.o); return; }
  const L = life(t, o.t0, o.t1, .38, .22, 1.6); if (!L) { hide(el); return; }
  if (o.k === 'file') { // top-anchored: the patient file grows downward as rows get filled in
    if (el.style.display !== 'block') el.style.display = 'block'; el.style.opacity = L.o.toFixed(3); el.style.transformOrigin = '50% 0';
    el.style.transform = `translate(${(o.x || 540).toFixed(1)}px,${((o.y || 450) - 150 + bob(L.k, 0, 4)).toFixed(1)}px) translate(-50%,0) scale(${L.s.toFixed(4)})`;
  } else setT(el, o.x || 540, (o.y || 450) + bob(L.k, 0, 4), L.s, 0, L.o);
  if (o.k === 'file') {
    const rows = el.querySelectorAll('.fRow'); o.rows.forEach((r, i) => { const ts = Math.max(o.t0 + .25 + i * .12, r[0]); const d = t >= ts - .01 ? 'flex' : 'none'; if (rows[i].style.display !== d) rows[i].style.display = d; rowIn(rows[i], t, ts); });

  }
  if (o.k === 'list') { const rows = el.querySelectorAll('.ckRow'); o.rows.forEach((r, i) => checkRow(rows[i], t, r[0], r[2] === 'bad')); }
  if (o.k === 'ecg') {

    const crit = st[1] === 'crit', flat = st[1] === 'flat'; const col = crit || flat ? '#FF4B4B' : '#4ADE80';
    const v = el.querySelector('.eVal'); if (v.dataset.k !== st[2]) { v.dataset.k = st[2]; v.textContent = st[2]; v.style.background = crit || flat ? '#E11D2E' : '#16A34A'; }

    const lastY = 82 - (flat ? 0 : ecgShape((((per - t * speed) % 1) + 1) % 1)) * 62; const dot = el.querySelector('.eDot'); dot.setAttribute('cx', 600); dot.setAttribute('cy', lastY.toFixed(1)); dot.setAttribute('fill', col);
  }

    let s = null; for (const q of (o.status || [])) if (t >= q[0]) s = q; status(el.querySelector('.status'), s ? s[1] : '', s ? s[2] : '#000');
  }
}

// ---------- tracked ring on a real part ----------
const mapBg = (x, y) => [540 + (x - 540) * BGX.z + BGX.dx, 960 + (y - 960) * BGX.z + BGX.dy];
function rRings(t, n) {
  const svg = $('ringSvg'), ch = $('ringChip');
  const R = (CFG.rings || []).find(r => n >= r.f0 && n <= r.f1 + 5 && TL[r.track]);
  if (!R) { hide(svg); hide(ch); return; }
  const TR = TL[R.track]; const tr = TR[String(Math.min(R.f1, Math.max(R.f0, n)))] || TR[Object.keys(TR)[0]]; const [x, y] = mapBg(tr[0], tr[1]);
  const a0 = R.f0 / FPS, a1 = R.f1 / FPS; const o = clamp((t - a0) / .12) * (1 - clamp((t - a1) / .16));
  const r = ((R.r || 160) + 6 * Math.sin(t * 9)) * BGX.z * eBack(clamp((t - a0) / .3), 2);
  ['ringA', 'ringB'].forEach(id => { $(id).setAttribute('cx', x); $(id).setAttribute('cy', y); $(id).setAttribute('r', Math.max(1, r)); });
  $('ringB').setAttribute('stroke', R.col || '#62D8FF');
  const left = x > 540; const lx = left ? Math.max(250, x - r - 220) : Math.min(830, x + r + 220), ly = y;
  $('ringLn').setAttribute('d', left ? `M ${lx + 180} ${ly} L ${x - r - 6} ${y}` : `M ${lx - 180} ${ly} L ${x + r + 6} ${y}`);
  svg.style.display = 'block'; svg.style.opacity = o.toFixed(3); svg.style.transform = 'none';
  if (ch.dataset.k !== R.label) { ch.dataset.k = R.label; ch.querySelector('img').src = `assets/emoji/${R.ico || 'gear'}.png`; ch.querySelector('span').textContent = R.label; ch.className = 'chip abs ' + (R.cls || ''); }
  setT(ch, R.lx || lx, R.ly || ly, eBack(clamp((t - a0 - .08) / .3), 2.2), -3, o);
}

function rEnd(t) {
  const el = $('endCard'); if (t < SEND) { hide(el); return; }
  const k = t - SEND; el.style.display = 'block'; el.style.opacity = clamp(k / .3); el.style.transform = 'none';
  const seq = [['.eWord', .05], ['#eShare', .25], ['#eMap', 1.3], ['#eMapTitle', 1.45], ['#eFree', 2.9], ['#ePhone', 3.1], ['#eUrl', 3.3]];
  seq.forEach(([sel, d]) => { const c = el.querySelector(sel); const p = clamp((k - d) / .4);
    let tr = `translateY(${(1 - eOut(p)) * 40}px)`;
    if (sel === '#eShare') tr += ` scale(${p > 0 ? eBack(p, 2.0) * (1 + .025 * Math.sin((k - d) * 5)) : 0})`;
    if (sel === '#eFree' || sel === '#ePhone') tr += ` scale(${p > 0 ? eBack(p, 2.0) : 0})`;
    c.style.opacity = eOut(p); c.style.transform = tr; c.style.transformOrigin = '50% 50%'; });
  const ka = k - .6; const nud = ka > 0 ? Math.max(0, Math.sin(ka * 4.2)) : 0;
  $('sArrow').setAttribute('transform', `translate(${(nud * 10).toFixed(1)} ${(-nud * 6).toFixed(1)}) rotate(${(-nud * 10).toFixed(1)})`);
  const rk = (k % 1.2) / 1.2; $('sRing').setAttribute('r', (64 + rk * 16).toFixed(1)); $('sRing').setAttribute('opacity', (0.7 * (1 - rk)).toFixed(2));
  TL.map.cities.forEach((c, i) => { const d = 1.85 + i * .26, p = clamp((k - d) / .35);
    document.getElementById('pin' + i).querySelector('.pinG').setAttribute('transform', `translate(0 ${(-(1 - eOut(p)) * 60).toFixed(1)}) scale(${p > 0 ? eBack(p, 2.2) : 0})`);
    document.getElementById('lbl' + i).setAttribute('opacity', clamp((k - d - .15) / .3));
    const h = document.getElementById('halo' + i); const hk = ((k - d - .2) % 1.6 + 1.6) % 1.6; h.setAttribute('r', 10 + hk * 34); h.setAttribute('opacity', p >= 1 ? Math.max(0, .9 - hk / 1.6) : 0); });
}
function endCues() { sfx(SEND - .08, 'whoosh', .8); sfx(SEND + .3, 'ding', .55); sfx(SEND + .9, 'pop', .45);
  [0, 1, 2, 3].forEach(i => sfx(SEND + 1.9 + i * .26, 'pop', .45)); sfx(SEND + 3.1, 'ding', .45); }
